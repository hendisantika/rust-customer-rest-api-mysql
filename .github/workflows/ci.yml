name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests (MySQL 26.7.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:26.7.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: customer_db_test
          MYSQL_USER: customer
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      TEST_DATABASE_URL: mysql://customer:secret@127.0.0.1:3306/customer_db_test

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --locked

      - name: Unit and integration tests
        run: cargo test --all-targets --locked

  docker:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    outputs:
      pushed: ${{ steps.credentials.outputs.available }}

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rust-customer-rest-api-mysql

    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        id: credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the Docker Hub push: add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to enable it."
          fi

      - name: Set up Buildx
        if: steps.credentials.outputs.available == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.credentials.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.credentials.outputs.available == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The run number is the image version; `latest` follows main.
          tags: |
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo "Pushed \`${IMAGE}:${{ github.run_number }}\` and \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: docker
    if: needs.docker.outputs.pushed == 'true'

    environment:
      name: dev
      url: ${{ vars.DEV_APP_URL }}

    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the dev deploy: add the SSH_HOST and SSH_PRIVATE_KEY secrets to enable it."
          fi

      - name: Deploy over SSH
        if: steps.credentials.outputs.available == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rust-customer-rest-api-mysql
          TAG: ${{ github.run_number }}
          CONTAINER: customer-api-dev
          APP_PORT: ${{ vars.DEV_APP_PORT || '8080' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,TAG,CONTAINER,APP_PORT,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD
          script_stops: true
          script: |
            set -eu

            command -v docker >/dev/null 2>&1 || {
              echo "docker is not installed on the host"
              exit 1
            }

            echo "pulling ${IMAGE}:${TAG}"
            docker pull "${IMAGE}:${TAG}"

            # Keep the previous image id so a failed roll-out can be diagnosed.
            PREVIOUS=$(docker inspect -f '{{.Image}}' "${CONTAINER}" 2>/dev/null || true)
            echo "previous image: ${PREVIOUS:-none}"

            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true

            # The app applies its own migrations at start-up.
            docker run -d \
              --name "${CONTAINER}" \
              --restart unless-stopped \
              -p "${APP_PORT}:8080" \
              -e "DATABASE_URL=mysql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}" \
              -e RUST_LOG=info \
              "${IMAGE}:${TAG}"

            echo "waiting for the container to answer /health"
            for _ in $(seq 1 30); do
              if command -v curl >/dev/null 2>&1; then
                curl -fsS "http://127.0.0.1:${APP_PORT}/health" >/dev/null 2>&1 && {
                  echo "dev is healthy on ${IMAGE}:${TAG}"
                  exit 0
                }
              elif command -v wget >/dev/null 2>&1; then
                wget -q -O /dev/null "http://127.0.0.1:${APP_PORT}/health" && {
                  echo "dev is healthy on ${IMAGE}:${TAG}"
                  exit 0
                }
              else
                # No HTTP client on the host: settle for the container staying up.
                sleep 10
                [ "$(docker inspect -f '{{.State.Running}}' "${CONTAINER}")" = "true" ] && {
                  echo "the container is running (no HTTP client available to probe it)"
                  exit 0
                }
              fi
              sleep 2
            done

            echo "the container never became healthy; last 50 log lines:"
            docker logs --tail 50 "${CONTAINER}" || true
            exit 1

      - name: Summary
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo "Deployed \`${{ github.run_number }}\` to dev" >> "$GITHUB_STEP_SUMMARY"
