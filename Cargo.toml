[package]
name = "rust-customer-rest-api-mysql"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }

sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "mysql",
    "chrono",
    "derive",
    "macros",
    "migrate",
] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
validator = { version = "0.21.0", features = ["derive"] }

dotenvy = "0.15.7"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
