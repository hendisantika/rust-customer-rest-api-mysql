# Standalone server block for the Customer REST API.
#
# Use this only when the host has no existing server block to mount the API
# on. If one already listens on this port with the same server_name, do NOT
# install this file — add `include /etc/nginx/snippets/rust-customer.conf;`
# inside that block instead. Two blocks with the same listen/server_name pair
# make nginx warn about a conflicting server name and ignore the second.
#
# Install (the snippet is required — this file only wraps it):
#   sudo install -m 644 nginx/rust-customer.conf /etc/nginx/snippets/rust-customer.conf
#   sudo install -m 644 nginx/rust-customer-site.conf /etc/nginx/sites-available/rust-customer.conf
#   sudo ln -sf /etc/nginx/sites-available/rust-customer.conf /etc/nginx/sites-enabled/rust-customer.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check:
#   curl http://<host>:8080/customer/health

server {
    listen      8080;
    listen [::]:8080;
    server_name _;

    # Nothing else is served here, so point the bare root at the API.
    location = / {
        return 308 /customer/;
    }

    include /etc/nginx/snippets/rust-customer.conf;
}
