# Customer REST API behind nginx, mounted under /customer/.
#
# This file is a SNIPPET: a bare list of `location` blocks. It must be
# `include`d from inside an existing `server { ... }` block. Dropping it into
# sites-enabled/ puts these directives in the top-level `http` context, where
# nginx rejects them:
#
#   [emerg] "location" directive is not allowed here in
#           /etc/nginx/sites-enabled/rust-customer.conf:21
#
# If you have no server block to attach to, install rust-customer-site.conf
# into sites-available/ instead — it is a server block that includes this file.
#
# The deploy publishes the container on the host port set by the DEV_APP_PORT
# variable (8088 by default). Mounting under a prefix keeps whatever else the
# host server block already serves working untouched.
#
# Install:
#   sudo install -m 644 nginx/rust-customer.conf /etc/nginx/snippets/rust-customer.conf
#
#   # then, inside the existing `server { listen 8080; ... }` block:
#   include /etc/nginx/snippets/rust-customer.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check:
#   curl http://<host>:8080/customer/health
#   open http://<host>:8080/customer/swagger-ui/
#   # and in Swagger UI, "Try it out" must call /customer/api/v1/customers
#
# To mount under a different prefix, replace /customer throughout this file.
#
# Deliberately no `add_header` here: nginx drops a parent block's `add_header`
# set as soon as a child block declares one of its own, so adding headers in
# these locations would silently disable whatever security headers the host
# server block already sends. Set those in the host block instead.
#
# Rate limiting is not configured here either — `limit_req_zone` is only valid
# at `http` level and so cannot live in a snippet.

# `/customer` without the trailing slash would otherwise 404.
location = /customer {
    return 308 /customer/;
}

# Health checks run every few seconds and would otherwise dominate the access
# log. Kept separate from the block below purely to silence that logging.
location = /customer/health {
    access_log off;

    proxy_pass http://127.0.0.1:8088/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Fail fast so a wedged app surfaces as a 502 rather than a hung monitor.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;
}

# The OpenAPI document declares its server as `{"url":"/"}`, so Swagger UI's
# "Try it out" would resolve requests against the host root and escape the
# prefix — calling /api/v1/customers instead of /customer/api/v1/customers.
# Rewriting the declared server URL keeps those calls inside /customer/.
#
# The match depends on utoipa serialising `url` as the first key of the first
# server. If "Try it out" starts 404ing after a utoipa upgrade, re-check the
# raw document with:
#   curl -s http://127.0.0.1:8088/api-docs/openapi.json | head -c 120
location = /customer/api-docs/openapi.json {
    proxy_pass http://127.0.0.1:8088/api-docs/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # sub_filter cannot rewrite a compressed body.
    proxy_set_header Accept-Encoding "";
    sub_filter '"servers":[{"url":"/"' '"servers":[{"url":"/customer"';
    sub_filter_once on;
    sub_filter_types application/json;
}

# Swagger UI hardcodes an absolute path to the document ("/api-docs/openapi.json"),
# which would escape the prefix and hit whatever else this server block serves.
# Rewriting it here keeps the whole API inside /customer/.
#
# If your nginx lacks ngx_http_sub_module (Debian/Ubuntu: present in nginx-full,
# absent in nginx-light), drop this block and the one above, and instead proxy
# /api-docs/ to the API at the root of this server block.
location = /customer/swagger-ui/swagger-initializer.js {
    proxy_pass http://127.0.0.1:8088/swagger-ui/swagger-initializer.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # sub_filter cannot rewrite a compressed body.
    proxy_set_header Accept-Encoding "";
    sub_filter '"/api-docs/openapi.json"' '"/customer/api-docs/openapi.json"';
    sub_filter_once on;
    sub_filter_types application/javascript text/javascript;
}

location /customer/ {
    # The trailing slash strips the prefix: /customer/api/v1/customers
    # reaches the app as /api/v1/customers.
    proxy_pass http://127.0.0.1:8088/;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Prefix /customer;

    # The app redirects with root-relative locations, e.g.
    # /swagger-ui -> /swagger-ui/, which must stay inside the prefix. The
    # absolute form is listed first for the case where the app ever answers
    # with a full URL built from the upstream address.
    proxy_redirect http://127.0.0.1:8088/ /customer/;
    proxy_redirect /                      /customer/;

    # The API reports failures as JSON bodies. Without this, an `error_page`
    # rule in the host server block would replace them with nginx HTML.
    proxy_intercept_errors off;

    # Customer list pages compress well; Swagger UI ships ~1 MB of JS and CSS.
    # gzip_proxied is required — nginx does not compress proxied responses
    # by default.
    gzip             on;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       application/json application/javascript text/javascript text/css;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    client_max_body_size 1m;
}
