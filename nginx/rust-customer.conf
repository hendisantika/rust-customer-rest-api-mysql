# Customer REST API behind nginx, on its own hostname.
#
# Install:
#   sudo install -m 644 nginx/rust-customer.conf /etc/nginx/sites-available/rust-customer.conf
#   sudo ln -sf /etc/nginx/sites-available/rust-customer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check (from the host itself, bypassing DNS):
#   curl -s -H 'Host: rust-api.jvm.my.id' http://127.0.0.1/health
#   curl -sI -H 'Host: rust-api.jvm.my.id' http://127.0.0.1/swagger-ui/ | head -1
#
# nginx must NOT listen on the app's port. The container publishes 8088 on the
# host, so `listen 8088` here fails to bind — and `proxy_pass` to 127.0.0.1:8088
# from a block listening on 8088 would just loop back into nginx:
#
#   [emerg] bind() to 0.0.0.0:8088 failed (98: Address already in use)
#
# nginx terminates plain HTTP on 80 only; TLS is terminated in front of it by
# Cloudflare, which is why X-Forwarded-Proto is pinned to https rather than
# $scheme — $scheme would report "http" and make the app generate http:// URLs.
# Drop the pin and use $scheme if you ever put certificates on this host.
server {
    listen 80;

    server_name rust-api.jvm.my.id www.rust-api.jvm.my.id;

    # Served at the root of its own hostname, so no path rewriting is needed:
    # Swagger UI resolves /api-docs/openapi.json and the OpenAPI document's
    # own `"servers": [{"url": "/"}]` against this origin and they simply work.
    # Mounting the API under a sub-path instead would break both.

    # Customer list pages compress well, and Swagger UI ships ~1 MB of JS and
    # CSS. gzip_proxied is required — nginx does not compress proxied
    # responses by default.
    gzip             on;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       application/json application/javascript text/javascript text/css;

    # Health checks run every few seconds and would otherwise dominate the
    # access log. Timeouts are short so a wedged app surfaces as a 502 rather
    # than a hung monitor.
    location = /health {
        access_log off;

        proxy_pass http://127.0.0.1:8088/health;
        proxy_set_header Host $http_host;

        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The app answers /swagger-ui with a redirect to /swagger-ui/, which is
        # already correct at this origin — leave it untouched.
        proxy_redirect off;

        # The API reports failures as JSON bodies. Without this, an `error_page`
        # rule inherited from the http block would replace them with nginx HTML.
        proxy_intercept_errors off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        client_max_body_size 1m;
    }
}
